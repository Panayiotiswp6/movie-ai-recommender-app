<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MovieMind Picks Export</title>

<style>

body {
    margin: 0;
    padding: 40px;
    background: #071426;
    color: white;
    font-family: system-ui, sans-serif;
}

button {
    padding: 14px 22px;
    border: 0;
    border-radius: 10px;
    background: #247fff;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

#status {
    margin-top: 25px;
    white-space: pre-wrap;
    line-height: 1.6;
}

</style>

</head>


<body>

<h1>MovieMind — Picks Export</h1>

<p>
This performs the one-time TMDB lookup for
Panayiotis' Picks.
</p>

<button id="start">
    GENERATE FINAL PICKS FILE
</button>

<div id="status"></div>


<script src="./panayiotis-picks.js"></script>


<script>

const EXPORT_WORKER_URL =
    "https://movie-mind-picks-export.pankouzaris.workers.dev/";


const button =
    document.getElementById("start");


const status =
    document.getElementById("status");


button.addEventListener(
    "click",
    generateCatalog
);


async function generateCatalog() {

    button.disabled = true;

    status.textContent =
        "Starting TMDB lookup...\n";


    try {

        const catalog =
            window.PANAYIOTIS_CATALOG;


        if (!catalog ||
            !Array.isArray(catalog.movies)) {

            throw new Error(
                "Could not load panayiotis-picks.js"
            );

        }


        const movies =
            catalog.movies;


        const results = [];

        const batchSize = 10;


        for (
            let i = 0;
            i < movies.length;
            i += batchSize
        ) {

            const batch =
                movies.slice(
                    i,
                    i + batchSize
                );


            status.textContent +=
                `\nLooking up movies ${
                    i + 1
                }–${
                    Math.min(
                        i + batchSize,
                        movies.length
                    )
                } of ${
                    movies.length
                }...\n`;


            const response =
                await fetch(
                    EXPORT_WORKER_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            movies:
                                batch.map(movie => ({
                                    title:
                                        movie.title,

                                    year:
                                        movie.year
                                }))
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Worker error: ${
                        response.status
                    }`
                );

            }


            const data =
                await response.json();


            if (!data.success ||
                !Array.isArray(data.movies)) {

                throw new Error(
                    data.error ||
                    "Invalid Worker response."
                );

            }


            results.push(
                ...data.movies
            );

        }


        status.textContent +=
            "\nTMDB lookup completed.\n";


        const lookupMap =
            new Map(
                results.map(movie => [
                    `${movie.title}|||${movie.year}`,
                    movie
                ])
            );


        const finalMovies =
            movies.map(movie => {

                const found =
                    lookupMap.get(
                        `${movie.title}|||${movie.year}`
                    );


                return {

                    ...movie,

                    tmdb_id:
                        found?.tmdb_id ||
                        null,

                    poster_path:
                        found?.poster_path ||
                        null

                };

            });


        const missing =
            finalMovies.filter(movie =>
                !movie.tmdb_id ||
                !movie.poster_path
            );


        const finalCatalog = {

            ...catalog,

            version:
                "letterboxd-top10-per-category-2026-09-25-final",

            movies:
                finalMovies

        };


        const output =
            `// Panayiotis' Picks — permanent local catalog
// Generated from the confirmed Letterboxd catalog.
// TMDB IDs and poster paths were resolved once.
// No Worker/TMDB lookup is required when browsing Picks.

const PANAYIOTIS_CATALOG = ${JSON.stringify(
    finalCatalog,
    null,
    2
)};

window.PANAYIOTIS_CATALOG =
    PANAYIOTIS_CATALOG;
`;


        const blob =
            new Blob(
                [output],
                {
                    type:
                        "application/javascript"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "panayiotis-picks.js";


        document.body.appendChild(link);

        link.click();

        link.remove();


        URL.revokeObjectURL(url);


        status.textContent +=
            `\nFINAL FILE GENERATED.\n\n`;


        if (missing.length) {

            status.textContent +=
                `WARNING:\n${
                    missing.length
                } movies did not receive a TMDB ID/poster.\n\n`;

            missing.forEach(movie => {

                status.textContent +=
                    `- ${movie.title} (${movie.year})\n`;

            });

        } else {

            status.textContent +=
                "SUCCESS: All 66 movies have TMDB data.\n\n";

        }


        status.textContent +=
            "Replace your existing panayiotis-picks.js with the downloaded file.";


    } catch (error) {

        console.error(error);

        status.textContent +=
            `\nERROR:\n${error.message}`;

        button.disabled = false;

    }

}

</script>

</body>

</html>
